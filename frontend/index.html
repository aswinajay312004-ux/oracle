<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3faf6">
  <title>POPPYS AI · Orders</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f8a5f'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='700' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/overview" aria-label="POPPYS AI overview"><span class="brand-mark">P</span><span class="brand-text"><span>POPPYS <b>AI</b></span><small>Excel → Oracle</small></span></a>
      <nav class="nav" id="nav">
        <a href="#/overview" data-route="overview"><span class="ico" data-icon="home"></span><span>Overview</span></a>
        <a href="#/new" data-route="new"><span class="ico" data-icon="upload"></span><span>New Order</span></a>
        <a href="#/orders" data-route="orders"><span class="ico" data-icon="list"></span><span>Orders</span></a>
        <a href="#/database" data-route="database"><span class="ico" data-icon="database"></span><span>Database</span></a>
        <a href="#/settings" data-route="settings"><span class="ico" data-icon="settings"></span><span>Settings</span></a>
      </nav>
      <div class="sidebar-foot"><span class="status-dot" id="side-dot"></span><span id="side-status">Checking Oracle…</span></div>
    </aside>
    <div class="main-col">
      <header class="topbar">
        <div><h1 id="page-title">Overview</h1><p id="page-sub" class="muted"></p></div>
        <div class="top-actions">
          <span class="pill" id="oracle-pill"><span class="status-dot" id="top-dot"></span><span id="oracle-label">Oracle</span></span>
          <div class="account"><span class="avatar" id="avatar">A</span><span class="account-name" id="username">Admin</span>
            <button class="btn ghost small" id="logout" type="button">Sign out</button></div>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="drawer-backdrop" class="backdrop" hidden></div>
  <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <header class="drawer-head"><div><span class="eyebrow" id="drawer-eyebrow"></span><h2 id="drawer-title"></h2></div>
      <button class="icon-btn" id="drawer-close" type="button" aria-label="Close panel"><span class="ico" data-icon="x"></span></button></header>
    <div id="drawer-tabs" class="tabs" hidden></div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <div id="modal-backdrop" class="backdrop modal-layer" hidden></div>
  <section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
    <header class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" id="modal-close" type="button" aria-label="Close"><span class="ico" data-icon="x"></span></button></header>
    <div id="modal-body" class="modal-body"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="loading" class="loading" role="status" hidden><span class="spinner"></span><span id="loading-text">Working…</span></div>

  <div id="auth" class="auth" hidden>
    <form id="auth-form" class="auth-card">
      <span class="brand-mark large">P</span>
      <h1 id="auth-title">Welcome back</h1>
      <p id="auth-desc" class="muted">Sign in as the POPPYS AI administrator.</p>
      <label class="field">Username<input id="auth-user" autocomplete="username" required minlength="2" maxlength="50"></label>
      <label class="field">Password<input id="auth-pass" type="password" autocomplete="current-password" required minlength="10" maxlength="200"></label>
      <p id="auth-error" class="form-error" role="alert" hidden></p>
      <button class="btn primary full" id="auth-submit" type="submit">Sign in</button>
      <small class="muted">Everything runs on this computer. Nothing is sent to the internet.</small>
    </form>
  </div>

  <script src="/static/core.js" defer></script>
  <script src="/static/overview.js" defer></script>
  <script src="/static/neworder.js" defer></script>
  <script src="/static/mapping.js" defer></script>
  <script src="/static/orders.js" defer></script>
  <script src="/static/database.js" defer></script>
  <script src="/static/settings.js" defer></script>
  <script src="/static/app.js" defer></script>
</body>
</html>
